<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Washington Electric Vehicle Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 10px;
            font-size: 16px;
            color: #d1d5db;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section {
            background: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #111827;
        }

        .pdf-container {
            width: 100%;
            height: 750px;
            margin-top: 25px;
            border-radius: 10px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>Washington Electric Vehicle Dashboard</h1>
    <p>Electric Vehicle Data Analysis & Visualization</p>
</header>

<div class="container">

    <div class="section">
        <h2>Project Presentation</h2>

        <p>
            Explore the complete presentation covering the dataset,
            data preparation, visualizations, analysis, and key insights.
        </p>

        <div class="pdf-container">
            <iframe src="WA_EV_Dashboard_Presentation.pdf"></iframe>
        </div>

        <a
            href="WA_EV_Dashboard_Presentation.pdf"
            target="_blank"
            class="button">
            Open Presentation in New Tab
        </a>
    </div>

</div>

<footer>
    Washington Electric Vehicle Dashboard
</footer>

</body>
</html>
